<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MundiGol | Trivia</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      #example-scanning-overlay{
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: transparent;
        z-index: 2;

      }
      @media (min-aspect-ratio: 1/1) {
        #example-scanning-overlay .inner {
        width: 50vh;
        height: 50vh;
        }
      }
      @media (max-aspect-ratio: 1/1) {
        #example-scanning-overlay .inner {
        width: 80vw;
        height: 80vw;
        }
      }       
    </style>
  </head>
  <body>
    <div class="imagen-fondo-superior"></div>
    <div class="imagen-fondo-inferior"></div>

    <div class="container">
        <div class="titulo-container">
            <h1 class="titulo">TRIVIA</h1>
        </div>
        <div class="trivia-container">
            <div class="pregunta-container">
            <p class="pregunta">¿Quién ganó la Copa del Mundo en 2022?</p>
            </div>
            <div class="respuestas-container">
            <a href="#" class="respuesta-boton">Brasil</a>
            <a href="#" class="respuesta-boton">Argentina</a>
            <a href="#" class="respuesta-boton">Francia</a>
            </div>
        </div>
        </div>
        <a href="#" class="boton-saltar">Saltar</a>
        <a href="#" class="boton-ayuda">?</a>
  </body>
</html>
