<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MundiGol | Trivia</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      #example-scanning-overlay{
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: transparent;
        z-index: 2;

      }
      @media (min-aspect-ratio: 1/1) {
        #example-scanning-overlay .inner {
        width: 50vh;
        height: 50vh;
        }
      }
      @media (max-aspect-ratio: 1/1) {
        #example-scanning-overlay .inner {
        width: 80vw;
        height: 80vw;
        }
      }       
    </style>
  </head>
  <body>
    <div class="imagen-fondo-superior"></div>
    <div class="imagen-fondo-inferior"></div>

    <div class="container">
        <div class="titulo-container">
            <h1 class="titulo">TRIVIA</h1>
        </div>
        <div class="trivia-container">
            <div class="pregunta-container">
            <p class="pregunta">¿Quién ganó la Copa del Mundo en 2022?</p>
            </div>
            <div class="respuestas-container">
            <a href="#" class="respuesta-boton">a) Brasil</a>
            <a href="#" class="respuesta-boton">b) Argentina</a>
            <a href="#" class="respuesta-boton">c) Francia</a>
            </div>
        </div>
        </div>
        <a href="#" class="boton-saltar">Saltar</a>
        <a href="#" class="boton-cerrar">×</a>

        <div id="modal-cerrar" class="modal-overlay">
        <div class="modal-contenido">
            <p>Deseas salir?</p>
            <div class="modal-botones">
                <a href="index.html" class="modal-boton-si">Sí</a>
                <button class="modal-boton-no">No</button>
            </div>
        </div>
    </div>

    <script>
        // Obtener los elementos del DOM
        const botonCerrar = document.querySelector('.boton-cerrar');
        const modal = document.getElementById('modal-cerrar');
        const botonNo = document.querySelector('.modal-boton-no');

        // Función para mostrar el modal
        function mostrarModal() {
            modal.classList.add('show');
        }

        // Función para ocultar el modal
        function ocultarModal() {
            modal.classList.remove('show');
        }

        // Eventos de click
        botonCerrar.addEventListener('click', mostrarModal);
        botonNo.addEventListener('click', ocultarModal);
    </script>
  </body>
</html>
