<!DOCTYPE html>

<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MundiGol | Modo AR</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #example-scanning-overlay {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: transparent;
        z-index: 2;
      }
      @media (min-aspect-ratio: 1/1) {
        #example-scanning-overlay .inner {
          width: 50vh;
          height: 50vh;
        }
      }
      @media (max-aspect-ratio: 1/1) {
        #example-scanning-overlay .inner {
          width: 80vw;
          height: 80vw;
        }
      }

      #example-scanning-overlay .inner {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background: linear-gradient(to right, white 10px, transparent 10px) 0 0, linear-gradient(to right, white 10px, transparent 10px) 0 100%, linear-gradient(to left, white 10px, transparent 10px) 100% 0, linear-gradient(to left, white 10px, transparent 10px) 100% 100%, linear-gradient(to bottom, white 10px, transparent 10px) 0 0, linear-gradient(to bottom, white 10px, transparent 10px) 100% 0, linear-gradient(to top, white 10px, transparent 10px) 0 100%, linear-gradient(to top, white 10px, transparent 10px) 100% 100%;
        background-repeat: no-repeat;
        background-size: 40px 40px;
      }

      #example-scanning-overlay.hidden {
        display: none;
      }

      #example-scanning-overlay img {
        opacity: 1;
        width: 100%;
        align-self: center;
        margin: 0px;
        padding: 0px;
      }

      #example-scanning-overlay .inner .scanline {
        position: absolute;
        width: 100%;
        height: 10px;
        background: white;
        animation: move 2s linear infinite;
      }
      @keyframes move {
        0%,
        100% {
          top: 0%;
        }
        50% {
          top: calc(100% - 10px);
        }
      }
    </style>
  </head>

  <body>
    <a href="index.html" class="boton-cerrar" style="position: absolute; top: 20px; right: 20px; z-index: 10;">×</a>

    <div id="example-scanning-overlay">
      <div class="inner">
        <img src="fondoscanner.png" alt="Scanning for markers" />
        <div class="scanline"></div>
      </div>
    </div>

    <div id="nombre-pais-ui">
      <p id="nombre-pais"></p>
    </div>

    <div class="top-left-controls">
      <button id="play-pause-btn" class="control-btn">
        <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
      </button>    
    </div>
    
    <div id="player-card" class="hidden">
      <img id="player-image" src="" alt="Foto del Jugador" />
      <div id="player-data">
        <h3 id="player-name"></h3>
        <div id="player-rating"></div>
      </div>
    </div>    
    
    <a-scene
      mindar-image=" uiScanning: #example-scanning-overlay; filterBeta: 10; imageTargetSrc: ./targets.mind; maxTrack: 2"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- <a-asset-item id="bearModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/bear/scene.gltf"></a-asset-item>
        <a-asset-item id="raccoonModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/raccoon/scene.gltf"></a-asset-item> -->
        <a-asset-item id="usa" src="/modelos/usa.glb"></a-asset-item>
        <a-asset-item id="mexico" src="/modelos/mexico.glb"></a-asset-item>
        <a-asset-item id="canada" src="/modelos/canada.glb"></a-asset-item>
        <a-asset-item id="nz" src="/modelos/nz.glb"></a-asset-item>
        <a-asset-item id="iran" src="/modelos/iran.glb"></a-asset-item>
        <a-asset-item id="argentina" src="/modelos/argentina.glb"></a-asset-item>
        <a-asset-item id="uzbekistan" src="/modelos/uzbekistan.glb"></a-asset-item>
        <a-asset-item id="coreasur" src="/modelos/coreadelsur.glb"></a-asset-item>
        <a-asset-item id="egipto" src="/modelos/egipto.glb"></a-asset-item>
        <a-asset-item id="australia" src="/modelos/australia.glb"></a-asset-item>
        <a-asset-item id="brasil" src="/modelos/brazil.glb"></a-asset-item>
        <a-asset-item id="ecuador" src="/modelos/ecuador.glb"></a-asset-item>
        <a-asset-item id="uruguay" src="/modelos/uruguay.glb"></a-asset-item>
        <a-asset-item id="caboverde" src="/modelos/caboverde.glb"></a-asset-item>
        <a-asset-item id="paraguay" src="/modelos/paraguay.glb"></a-asset-item>
        <a-asset-item id="tunez" src="/modelos/tunez.glb"></a-asset-item>
        <a-asset-item id="argelia" src="/modelos/argelia.glb"></a-asset-item>
        <a-asset-item id="arabiasaudita" src="/modelos/arabiasaudita.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <!-- USA -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#usa" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Mexico -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#mexico" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Canada -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#canada" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Nueva Zelanda -->
       <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#nz" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Iran -->
       <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#iran" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Argentina -->
       <a-entity mindar-image-target="targetIndex: 5">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#argentina" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Uzbekistan -->
       <a-entity mindar-image-target="targetIndex: 6">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#uzbekistan" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Corea del Sur -->
       <a-entity mindar-image-target="targetIndex: 7">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#coreasur" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Egipto -->
       <a-entity mindar-image-target="targetIndex: 8">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#egipto" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Australia -->
      <a-entity mindar-image-target="targetIndex: 9">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#australia" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Brasil -->
      <a-entity mindar-image-target="targetIndex: 10">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#brasil" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Ecuador -->
      <a-entity mindar-image-target="targetIndex: 11">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#ecuador" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Uruguay -->
      <a-entity mindar-image-target="targetIndex: 12">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#uruguay" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Cabo Verde -->
      <a-entity mindar-image-target="targetIndex: 13">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#caboverde" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Paraguay -->
      <a-entity mindar-image-target="targetIndex: 14">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#paraguay" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Tunez -->
      <a-entity mindar-image-target="targetIndex: 15">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#tunez" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Argelia -->
      <a-entity mindar-image-target="targetIndex: 16">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#argelia" animation-mixer></a-gltf-model>
      </a-entity>
      <!-- Arabia Saudita -->
      <a-entity mindar-image-target="targetIndex: 17">
        <a-gltf-model rotation="0 270 0 " position="0 -1 0" scale="0.6 0.6 0.6" src="#arabiasaudita" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>    
  <script src="ar.js"></script>
  </body>
</html>
